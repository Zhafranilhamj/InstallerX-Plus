name: InstallerX-Plus signed APK

on:
  push:
    branches:
      - 'arena/b9ccf78d-installerx-plus'
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: installerx-plus-signed-${{ github.ref }}
  cancel-in-progress: true

env:
  RELEASE_VERSION: '26.11.6'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true
      - name: Check formatting and run unit tests
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          if ! ./gradlew spotlessCheck testStableDebugUnitTest --no-configuration-cache > "$RUNNER_TEMP/verification.log" 2>&1; then
            cat "$RUNNER_TEMP/verification.log"
            # Surface formatter and compiler diagnostics in the check, not just the exit code.
            details=$(tail -n 75 "$RUNNER_TEMP/verification.log")
            details=${details//'%'/'%25'}
            details=${details//$'\r'/'%0D'}
            details=${details//$'\n'/'%0A'}
            echo "::error title=Android verification failed::$details"
            exit 1
          fi
          cat "$RUNNER_TEMP/verification.log"
      - name: Prepare signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -eu
          : "${KEYSTORE_BASE64:?Missing KEYSTORE_BASE64}"
          : "${KEY_ALIAS:?Missing KEY_ALIAS}"
          : "${KEY_PASSWORD:?Missing KEY_PASSWORD}"
          STORE_PASSWORD="${STORE_PASSWORD:-${KEYSTORE_PASSWORD:-}}"
          : "${STORE_PASSWORD:?Missing STORE_PASSWORD or KEYSTORE_PASSWORD}"
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/installerx-release.jks"
          printf 'KEYSTORE_FILE=%s\nKEYSTORE_PASSWORD=%s\nKEY_ALIAS=%s\nKEY_PASSWORD=%s\n' \
            "$RUNNER_TEMP/installerx-release.jks" "$STORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" >> "$GITHUB_ENV"
      - name: Build signed release APK
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew assembleStableRelease --no-configuration-cache -PVERSION_NAME="$RELEASE_VERSION"
      - name: Verify APK identity and signature
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          fail() { echo "::error title=APK verification failed::$1"; exit 1; }
          mapfile -t apks < <(find app/build/outputs/apk -type f -ipath '*/stable/release/*.apk')
          [[ ${#apks[@]} -eq 1 ]] || fail "Expected one Stable Release APK, found ${#apks[@]}"
          apk="${apks[0]}"
          apksigner=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)
          [[ -x "$apksigner" ]] || fail 'Android Build Tools apksigner was not found'
          keytool -exportcert -keystore "$KEYSTORE_FILE" -storepass:env KEYSTORE_PASSWORD -alias "$KEY_ALIAS" \
            -file "$RUNNER_TEMP/expected-signer.der" || fail 'Could not read the configured keystore certificate'
          "$apksigner" verify --verbose --print-certs-pem "$apk" > "$RUNNER_TEMP/apk-signatures.txt" \
            || fail 'apksigner rejected the APK signature'
          # Compare certificate bytes; the signer labels/digest fields change between Android SDKs.
          python3 - "$RUNNER_TEMP/expected-signer.der" "$RUNNER_TEMP/apk-signatures.txt" <<'PYTHON'
          from pathlib import Path
          from ssl import PEM_cert_to_DER_cert
          import re
          import sys

          expected = Path(sys.argv[1]).read_bytes()
          output = Path(sys.argv[2]).read_text()
          pems = re.findall(r"-----BEGIN CERTIFICATE-----.*?-----END CERTIFICATE-----", output, re.DOTALL)
          if {PEM_cert_to_DER_cert(pem) for pem in pems} != {expected}:
              sys.exit(f"::error title=APK verification failed::Expected the keystore certificate; found {len(pems)} signer certificate blocks")
          PYTHON
          aapt2="$(dirname "$apksigner")/aapt2"
          "$aapt2" dump badging "$apk" > "$RUNNER_TEMP/apk-manifest.txt" || fail 'aapt2 could not read the APK manifest'
          manifest="$RUNNER_TEMP/apk-manifest.txt"
          package=$(grep -m1 '^package:' "$manifest" || true)
          echo "$package"
          [[ "$package" == *"name='com.installerx.plus'"* ]] || fail 'Unexpected application ID in packaged APK'
          [[ "$package" == *"versionName='$RELEASE_VERSION'"* ]] || fail "Expected versionName $RELEASE_VERSION"
          # aapt2 versions expose the default label as a standalone or application entry.
          grep -Eq "^(application-label:'InstallerX-Plus'|application: label='InstallerX-Plus'( |$))" "$manifest" \
            || fail 'Expected InstallerX-Plus launcher label'
          if grep -q '^application-debuggable' "$manifest"; then
            fail 'Stable release APK is debuggable'
          fi
          # Prove that this APK can update the previous stable release in place.
          previous_dir="$RUNNER_TEMP/previous-release"
          gh release download 26.11.5 --pattern 'InstallerX-Plus-26.11.5.apk' --dir "$previous_dir"
          previous="$previous_dir/InstallerX-Plus-26.11.5.apk"
          "$apksigner" verify --print-certs-pem "$previous" > "$RUNNER_TEMP/previous-signatures.txt"
          "$aapt2" dump badging "$previous" > "$RUNNER_TEMP/previous-manifest.txt"
          python3 - "$manifest" "$RUNNER_TEMP/previous-manifest.txt" "$RUNNER_TEMP/apk-signatures.txt" "$RUNNER_TEMP/previous-signatures.txt" <<'PYTHON'
          from pathlib import Path
          from ssl import PEM_cert_to_DER_cert
          import re
          import sys

          current, previous, current_signers, previous_signers = map(Path, sys.argv[1:])
          def version_code(path):
              return int(re.search(r"^package:.*?versionCode='(\d+)'", path.read_text(), re.MULTILINE)[1])
          if version_code(current) <= version_code(previous):
              sys.exit("::error::The APK version code must be higher than the previous release")
          def certificates(path):
              return {PEM_cert_to_DER_cert(pem) for pem in re.findall(r"-----BEGIN CERTIFICATE-----.*?-----END CERTIFICATE-----", path.read_text(), re.DOTALL)}
          if certificates(current_signers) != certificates(previous_signers):
              sys.exit("::error::The APK signing certificate differs from the previous release")
          print(f"Upgrade verified: versionCode {version_code(previous)} -> {version_code(current)}; same signing certificate")
          PYTHON
          mkdir -p release-apk
          cp "$apk" "release-apk/InstallerX-Plus-$RELEASE_VERSION.apk"
      - name: Remove temporary signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/installerx-release.jks"
      - uses: actions/upload-artifact@v7
        with:
          path: release-apk/InstallerX-Plus-${{ env.RELEASE_VERSION }}.apk
          if-no-files-found: error
          retention-days: 90
          archive: false

  render_tests:
    name: Rendering on Android
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run Android rendering and accessibility tests
        uses: reactivecircus/android-emulator-runner@v2
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: ./gradlew connectedStableDebugAndroidTest --no-configuration-cache --console=plain > "$RUNNER_TEMP/render-tests.log" 2>&1
      - name: Report rendering test diagnostics
        if: failure()
        shell: bash
        run: |
          if [[ -f "$RUNNER_TEMP/render-tests.log" ]]; then
            cat "$RUNNER_TEMP/render-tests.log"
            details=$(tail -n 75 "$RUNNER_TEMP/render-tests.log")
            details=${details//'%'/'%25'}
            details=${details//$'\r'/'%0D'}
            details=${details//$'\n'/'%0A'}
            echo "::error title=Android rendering tests failed::$details"
          fi
          python3 - <<'PYTHON'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          for path in Path("app/build/outputs/androidTest-results").rglob("*.xml"):
              for test in ET.parse(path).iter("testcase"):
                  for failure in test.findall("failure") + test.findall("error"):
                      message = (failure.text or failure.get("message", ""))[:6000]
                      message = message.replace("%", "%25").replace("\n", "%0A").replace("\r", "%0D")
                      print(f"::error title={test.get('name', 'Rendering test')}::{message}")
          PYTHON
      - name: Upload rendering test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: aero-rendering-test-reports
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
          if-no-files-found: warn
          retention-days: 14

  publish:
    needs: [build, render_tests]
    # Only this release branch may publish, and both verification jobs must succeed first.
    if: github.ref == 'refs/heads/arena/b9ccf78d-installerx-plus'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          sparse-checkout: CHANGELOG_26.11.6.md
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@v8
        with:
          name: InstallerX-Plus-${{ env.RELEASE_VERSION }}.apk
          path: release-apk
      - name: Publish the signed APK and changelog
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$RELEASE_VERSION" "release-apk/InstallerX-Plus-$RELEASE_VERSION.apk" \
            --target "$GITHUB_SHA" --title "InstallerX-Plus $RELEASE_VERSION" \
            --notes-file "CHANGELOG_$RELEASE_VERSION.md"
