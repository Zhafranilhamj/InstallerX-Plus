name: Style diagnostic
on:
  push:
    branches: [ 'arena/268148ca-installerx-plus' ]
permissions:
  contents: read
  packages: read
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v6
      - name: Diagnose check
        run: |
          set +e
          ./gradlew spotlessCheck --no-configuration-cache > /tmp/check.log 2>&1
          STATUS=$?
          tail -n 35 /tmp/check.log | while IFS= read -r line; do echo "::notice::$line"; done
          exit "$STATUS"
